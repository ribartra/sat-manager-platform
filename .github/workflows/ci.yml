name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-auth-secret
      AUTH_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Static QA gates (security, RBAC scope, edge cases, practice areas, UI states/CSP)
        run: npm run qa:p0 && npm run qa:authz && npm run qa:edge && npm run qa:practice-area && npm run qa:ui

      - name: Build
        run: npm run build
