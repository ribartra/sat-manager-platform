# Production stack for the single-VM deployment. Rendered onto the VM by
# Terraform (pulled from the config bucket by deploy/vm-startup.sh).
#
# Variable substitution comes from /data/stack/.env (REGISTRY, TAG, DOMAIN).
# Secret + config env comes from /data/app.env (rendered from Secret Manager).
#
# Shared, persisted paths live on the attached data disk mounted at /data:
#   /data/db       -> SQLite dev.db (+ -wal/-shm) shared by web and ingest
#   /data/uploads  -> public/uploads (served same-origin by the web app)
#   /data/private  -> .private/uploads/ingest (staging images)
name: sat-platform

services:
  web:
    image: ${REGISTRY}/web:${TAG:-latest}
    restart: unless-stopped
    # Limits on the 4 GB VM (web + ingest + caddy + OS): a runaway process is restarted alone instead
    # of the kernel OOM-killing whatever it picks. Measured idle: web ~310 MB, ingest ~75 MB.
    mem_limit: 1536m
    # tini as PID 1 (signals, zombies) and time to finish open requests on deploy/restart.
    init: true
    stop_grace_period: 30s
    env_file:
      - /data/app.env
    environment:
      NODE_ENV: production
      # V8 heap under the container limit: Node collects garbage before the kernel kills it.
      NODE_OPTIONS: --max-old-space-size=1024
      DATABASE_URL: file:/db/dev.db
      AI_INGEST_SERVICE_URL: http://ingest-service:8000
      INGEST_PUBLIC_UPLOAD_ROOT: /app/.private/uploads/ingest
      # GCS_BUCKET / GCS_PROJECT_ID come from /data/app.env (vm-startup).
      # Dual-write keeps /data/uploads populated during the migration window.
      GCS_DUAL_WRITE_DISK: "true"
    volumes:
      - /data/db:/db
      - /data/uploads:/app/public/uploads
      - /data/private:/app/.private
    depends_on:
      ingest-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    expose:
      - "3000"

  ingest-service:
    image: ${REGISTRY}/ingest:${TAG:-latest}
    restart: unless-stopped
    # OCR / PDF parsing peaks stay inside this; an overrun restarts ingest only, never the web app.
    mem_limit: 1536m
    init: true
    stop_grace_period: 30s
    env_file:
      - /data/app.env
    environment:
      DATABASE_URL: file:/db/dev.db
      INGEST_PUBLIC_UPLOAD_ROOT: /app/.private/uploads/ingest
    volumes:
      - /data/db:/db
      - /data/private:/app/.private
    # Internal only — never published to the host. Reachable by web at
    # http://ingest-service:8000 over the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data
      - /data/caddy/config:/config
    depends_on:
      - web
